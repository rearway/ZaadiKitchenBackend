version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: zaadi_postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: zaadi
      POSTGRES_PASSWORD: zaadi_dev_password
      POSTGRES_DB: zaadi_kitchen
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # redis:
  #   image: redis:7-alpine
  #   container_name: zaadi_redis
  #   restart: unless-stopped
  #   ports:
  #     - '6379:6379'
  #   volumes:
  #     - redis_data:/data

volumes:
  postgres_data:
  redis_data:
